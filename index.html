<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whackathon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* one palette, both modes */
  --yellow:#F6E84A; --pink:#F4A7D8; --blue:#3FA9F5; --purple:#8C6CF2; --teal:#2F8F78; --orange:#F2793A; --red:#E5392F;
  --white:#FFFFFF; --cline:#000000; --mouth:#000000;
  /* light surfaces */
  --bg:#F6E84A; --surface:#FFFFFF; --line:#000000; --ink:#000000; --muted:#4D4818; --dash:#9C9442;
  --shadow:transparent; --halo:transparent; --band:#2F8F78; --card:#FFFFFF; --card-ink:#000000;
  --display:'Gaegu','Comic Sans MS','Chalkboard SE',cursive;
  --sans:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --white:#FBF6E9;
    --bg:#000000; --surface:#151515; --line:#FBF6E9; --ink:#FBF6E9; --muted:#BDB7A4; --dash:#4C4A44;
    --shadow:transparent; --halo:#FBF6E9; --card:#FBF6E9; --card-ink:#000000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --white:#FBF6E9;
  --bg:#000000; --surface:#151515; --line:#FBF6E9; --ink:#FBF6E9; --muted:#BDB7A4; --dash:#4C4A44;
  --shadow:transparent; --halo:#FBF6E9; --card:#FBF6E9; --card-ink:#000000;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation;padding:10px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px dashed var(--ink);outline-offset:3px}
.defs{position:absolute;width:0;height:0}
.shadowc{flood-color:var(--shadow)}
.haloc{flood-color:var(--halo)}

/* the wiggly display face: hand font + per-letter jitter + boiling line */
.disp{font-family:var(--display);font-weight:700;filter:url(#wobt)}
.disp .w{display:inline-block;white-space:nowrap}
.disp .l{display:inline-block;transform:translateY(var(--y)) rotate(var(--r))}

/* poster frame: ticked band with corner blocks */
.shell{position:relative;height:100%}
.band{position:absolute;inset:0;border:3px solid var(--cline);
  background:
    repeating-linear-gradient(90deg,var(--cline) 0 2.5px,transparent 2.5px 22px) top/100% 24px no-repeat,
    repeating-linear-gradient(90deg,var(--cline) 0 2.5px,transparent 2.5px 22px) bottom/100% 24px no-repeat,
    repeating-linear-gradient(0deg,var(--cline) 0 2.5px,transparent 2.5px 22px) left/24px 100% no-repeat,
    repeating-linear-gradient(0deg,var(--cline) 0 2.5px,transparent 2.5px 22px) right/24px 100% no-repeat,
    var(--band);filter:url(#wob)}
.corner{position:absolute;width:30px;height:30px;background:var(--band);border:3px solid var(--cline);z-index:2;filter:url(#wob)}
.corner::after{content:"";position:absolute;inset:6px;border:2.5px solid var(--cline);background:var(--yellow)}
.corner.tl{left:0;top:0}.corner.tr{right:0;top:0}.corner.bl{left:0;bottom:0}.corner.br{right:0;bottom:0}

.app{position:absolute;inset:24px;background:var(--bg);border:3px solid var(--cline);
  display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,22vw,310px);gap:clamp(14px,1.8vw,24px);
  padding:clamp(12px,1.6vw,22px);overflow:hidden}
:root[data-theme="dark"] .app{border-color:var(--line)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .app{border-color:var(--line)} }

/* board + outlined grid */
.board{position:relative;min-height:0;min-width:0}
.grid,.lines{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr)}
.lines{pointer-events:none;filter:url(#wob);border:3px solid var(--line);border-radius:6px;z-index:3}
.lines i{border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
.lines i:nth-child(6n){border-right:0}
.lines i:nth-last-child(-n+6){border-bottom:0}
.cell{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;padding:6px;-webkit-tap-highlight-color:transparent}
.cell svg.ch{flex:1;min-height:0;width:100%;overflow:visible;margin-top:12%}
.name{font-size:clamp(13px,1.15vw,17px);line-height:1;padding:2px 0 0 4px;white-space:nowrap;overflow:hidden}
@media (pointer:fine){ .board,.board *{cursor:none} }

/* characters */
.ch path,.ch circle,.ch ellipse,.ch rect{stroke:var(--cline);stroke-width:1.6;fill:var(--white);stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ch .head :is(path,circle,ellipse,rect){fill:var(--hc)}
.ch .body :is(path,circle,ellipse,rect){fill:var(--bc)}
.ch :is(path,circle,ellipse,rect).n{fill:none}
.ch :is(path,circle,ellipse,rect).k{fill:var(--cline);stroke:none}
.ch path.ground{fill:none;stroke:var(--line)}
.ch .wake{display:none}
.on .ch .wake{display:inline}
.on .ch .sleep{display:none}
.on.shut .ch .mo.wake{display:none}
.on.shut .ch .mo.sleep{display:inline}
.press{transition:transform .12s ease-out}
.cell.pressed .fig{filter:url(#figP)}
.cell.pressed .press{transform:translate(1.8px,1.8px);transition-duration:.04s}
.pose{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;animation-delay:var(--d,0s)}
.cell.on .pose{animation:alert .35s cubic-bezier(.34,1.8,.64,1) forwards}
.cell.hit .pose{animation:squash .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes breathe{50%{transform:scaleY(1.025)}}
@keyframes alert{0%{transform:none}60%{transform:translateY(-9%) scaleY(1.07)}100%{transform:translateY(-5%) scaleY(1.03)}}
@keyframes squash{0%{transform:scaleY(.6) scaleX(1.15)}100%{transform:none}}
body.paused .board *{animation-play-state:paused!important}

/* speech card */
.card{position:absolute;top:6px;left:6px;right:6px;z-index:6;background:var(--card);border-radius:9px;color:var(--card-ink);
  padding:4px 8px 7px;font-size:clamp(14px,1.2vw,18px);line-height:1.05;text-align:center;
  animation:cardIn .25s cubic-bezier(.34,1.56,.64,1)}
.card::before{content:"";position:absolute;inset:0;border:2px solid var(--cline);border-radius:9px;filter:url(#wob);pointer-events:none}
.card::after{content:"";position:absolute;left:50%;bottom:-7px;width:11px;height:11px;background:var(--card);
  border-right:2px solid var(--cline);border-bottom:2px solid var(--cline);border-bottom-right-radius:4px;transform:translateX(-50%) rotate(45deg)}
.timer{display:block;height:3px;margin-top:5px;background:var(--red);border-radius:2px;transform-origin:left}
@keyframes cardIn{from{opacity:0;translate:0 6px}}
.card.gone{animation:cardOut .3s ease forwards}
@keyframes cardOut{to{opacity:0;translate:0 -12px;rotate:-5deg}}
.card.missed{animation:missed .45s ease forwards}
@keyframes missed{30%{rotate:5deg}60%{rotate:-5deg}100%{opacity:0;translate:30px 0}}
.bonk{position:absolute;left:50%;top:42%;z-index:7;pointer-events:none;font-size:clamp(18px,1.8vw,26px);
  transform:translate(-50%,-50%);animation:bonk .6s ease-out forwards;color:var(--ink)}
@keyframes bonk{0%{scale:.4;opacity:1}40%{scale:1.15}100%{scale:1;opacity:0;translate:0 -26px}}

/* side column */
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.stats{display:flex;align-items:center;justify-content:space-between}
.cups{display:flex;gap:6px}
.cups svg{width:30px;height:auto;overflow:visible}
.cups .empty .coffee,.cups .empty .steam{display:none}
.score{font-size:22px;line-height:1}
.score b{font-size:30px;font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:1fr;gap:10px}
.theme-toggle{position:fixed;z-index:200;top:calc(env(safe-area-inset-top,0px) + 4px);right:54px;width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;padding:0;background:var(--surface);color:var(--ink);border:2.5px solid var(--cline);box-shadow:2px 2px 0 var(--shadow);
  transition:transform .06s,box-shadow .06s}
.theme-toggle svg{width:18px;height:18px}
.theme-toggle:active{transform:translate(2px,2px);box-shadow:none}
.refresh-btn{right:98px}
.sound-btn{right:142px}
.sound-btn[aria-pressed="false"] .waves{display:none}
.sound-btn[aria-pressed="true"] .mute{display:none}
.btn{background:var(--surface);border:2.5px solid var(--line);border-radius:12px;padding:8px 10px;font-family:var(--sans);font-size:14px;font-weight:600;
  box-shadow:3px 3px 0 var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5;cursor:default}

.todo{position:relative;flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-radius:10px;padding:14px 16px 12px;isolation:isolate}
.todo::before{content:"";position:absolute;inset:0;border:2.5px solid var(--line);border-radius:10px;box-shadow:3px 3px 0 var(--shadow);filter:url(#wob);pointer-events:none;z-index:-1}
.todo-head{display:flex;justify-content:space-between;align-items:baseline;font-size:24px;line-height:1;margin-bottom:6px}
.todo.danger #count{color:var(--red)}
.todo ol{list-style:none;margin:0;padding:0;flex:1;min-height:0;display:grid;grid-template-rows:repeat(10,minmax(0,1fr))}
.todo li{display:flex;align-items:flex-end;gap:8px;border-bottom:2px dashed var(--dash);font-size:clamp(16px,1.3vw,19px);line-height:1;padding-bottom:3px;
  white-space:nowrap;overflow:hidden;min-height:0}
.todo li .box{flex:none;width:13px;height:13px;border:2px solid var(--line);border-radius:3px;margin-bottom:2px;opacity:.25}
.todo li.filled .box{opacity:1}
.todo li.new{animation:newItem .5s ease}
.todo li.danger{color:var(--red)}
.todo li.done{text-decoration:line-through;opacity:.4}
.todo li.done .box{background:var(--line)}
@keyframes newItem{0%{background:var(--pink);translate:-8px 0}100%{background:transparent}}
.todo-foot{margin:8px 0 0;font-size:12.5px;line-height:1.3;color:var(--muted)}
.streak{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.streak i{width:9px;height:9px;border:1.5px solid var(--line);border-radius:50%}
.streak i.on{background:var(--teal)}

/* hammer + sparkles */
.hammer{position:fixed;left:0;top:0;width:64px;height:64px;z-index:100;pointer-events:none;display:none;
  transform-origin:22px 60px;rotate:18deg;transition:rotate .12s ease-out}
.hammer.swing{rotate:-14deg;transition-duration:.05s}
@media (pointer:fine){ .hammer.show{display:block} }
.spark{position:fixed;z-index:350;pointer-events:none;width:18px;height:18px}

/* story dialogue */
.overlay{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:color-mix(in srgb,var(--bg) 80%,transparent)}
.overlay[hidden]{display:none}
.dialog{display:flex;align-items:flex-end;gap:clamp(8px,2vw,24px);max-width:720px;width:100%}
.speaker{flex:none;width:clamp(110px,16vw,190px);text-align:center}
.speaker svg{width:100%;height:auto;overflow:visible}
.who{font-size:18px;line-height:1.1;margin-top:4px}
.bubble{position:relative;flex:1;background:transparent;padding:24px 26px 20px;margin-bottom:40px;isolation:isolate;min-height:220px;display:flex;flex-direction:column}
.bubble::before{content:"";position:absolute;inset:0;border:3px solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);filter:url(#wob);z-index:-1;background:var(--surface)}
.bubble::after{content:"";position:absolute;left:-14px;bottom:34px;width:22px;height:22px;background:var(--surface);
  border-left:3px solid var(--line);border-bottom:3px solid var(--line);border-bottom-left-radius:7px;transform:rotate(45deg);z-index:0}
.bubble h2{margin:0 0 10px;font-size:clamp(32px,4vw,46px);line-height:.95;font-weight:700}
.bubble p{margin:0 0 18px;font-size:17px;line-height:1.5;flex:1;min-height:3em}
.ask{margin:-6px 0 18px}
.ask[hidden]{display:none}
.ask input{width:100%;font-family:var(--sans);font-size:18px;padding:11px 14px;border:2.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
.ask input:focus{box-shadow:3px 3px 0 var(--shadow)}
.ask input::placeholder{color:var(--muted)}
.ask.nope input{animation:nope .35s}
@keyframes nope{25%{translate:-6px 0}50%{translate:6px 0}75%{translate:-3px 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.dlg-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--pink)}
.dlg-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-left:auto}
.go.arrow{display:inline-grid;place-items:center;padding:9px 16px}
.go.arrow svg{width:22px;height:22px}
.go{background:var(--pink);color:#000;border:2.5px solid var(--cline);border-radius:12px;padding:10px 20px;font-family:var(--sans);font-size:16px;font-weight:700;
  box-shadow:4px 4px 0 var(--shadow)}
.go.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.go:active{transform:translate(4px,4px);box-shadow:none}
.flash{position:absolute;left:50%;top:50%;z-index:40;transform:translate(-50%,-50%);pointer-events:none;background:var(--red);color:#fff;
  border:2.5px solid var(--cline);border-radius:14px;padding:10px 22px 14px;font-size:clamp(28px,3.6vw,40px);
  box-shadow:5px 5px 0 var(--shadow);animation:flash 1.3s ease forwards;white-space:nowrap}
@keyframes flash{0%{scale:.6;opacity:0}15%{scale:1.05;opacity:1}75%{scale:1;opacity:1}100%{opacity:0}}

@media (max-width:760px){
  body{padding:6px}
  .band{background-size:100% 16px,100% 16px,16px 100%,16px 100%,auto}
  .corner{width:22px;height:22px}.corner::after{inset:4px}
  .app{inset:16px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:8px;gap:8px}
  .grid,.lines{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr)}
  .lines i:nth-child(6n){border-right:2px solid var(--line)}
  .lines i:nth-child(4n){border-right:0}
  .lines i:nth-last-child(-n+6){border-bottom:2px solid var(--line)}
  .lines i:nth-last-child(-n+4){border-bottom:0}
  .cell{padding:3px}
  .cell svg.ch{margin-top:24%}
  .card{font-size:12px;padding:3px 4px 5px;top:3px;left:3px;right:3px}
  .name{font-size:12px}
  .side{display:grid;grid-template-columns:auto 1fr;gap:8px 10px}
  .stats{grid-column:1;grid-row:1;gap:10px}
  .cups svg{width:22px}
  .score{font-size:18px}.score b{font-size:22px}
  .controls{grid-column:1;grid-row:2}
  .btn{font-size:12px;padding:6px 8px}
  .theme-toggle{width:30px;height:30px;right:36px;top:calc(env(safe-area-inset-top,0px) + 2px)}
  .refresh-btn{right:72px}
  .sound-btn{right:108px}
  .theme-toggle svg{width:15px;height:15px}
  .todo{grid-column:2;grid-row:1/3;height:104px;padding:8px 10px}
  .todo-head{font-size:18px;margin-bottom:2px}
  .todo ol{display:flex;flex-direction:column-reverse;justify-content:flex-end;overflow:hidden}
  .todo li{font-size:14px;flex:none;height:19px}
  .todo li:not(.filled){display:none}
  .todo-foot{display:none}
  .role{grid-column:1/3;grid-row:3;padding:6px 10px}
  .role-next{display:none}
  #roleName{font-size:17px}
  .ladder{margin:5px 0 0;height:7px}
  .lives-label{font-size:10px;margin-bottom:1px}
  .dialog{flex-direction:column;align-items:stretch}
  .speaker{width:110px;align-self:flex-start;order:2;margin-top:-6px}
  .bubble{margin-bottom:0;min-height:0;padding:18px 18px 16px}
  .bubble::after{left:40px;bottom:-14px;transform:rotate(-45deg)}
  .bubble p{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
/* flat version: no hard shadows anywhere */
*,*::before,*::after{box-shadow:none!important}
.btn:active,.go:active,.theme-toggle:active{transform:scale(.96)}
.cell.pressed .press{transform:none}
:root{--hard:#000000}
:root[data-theme="dark"]{--hard:#8C6CF2}
.card::before{box-shadow:2px 2px 0 var(--hard)!important}
.bubble::before{box-shadow:5px 5px 0 var(--hard)!important}
.theme-toggle{box-shadow:2px 2px 0 var(--hard)!important}
.theme-toggle:active{box-shadow:none!important}
/* dialog buttons: hard shadow, visible hover and press */
.go{box-shadow:3px 3px 0 var(--hard)!important;transition:transform .07s ease-out,box-shadow .07s ease-out,background-color .12s}
.go:hover{transform:translate(-1px,-1px)}
.go:active{transform:translate(3px,3px)!important;box-shadow:0 0 0 var(--hard)!important}
.go.ghost:hover{background:var(--bg)}
.go:not(.ghost):hover{background:var(--yellow)}
:root[data-theme="light"] .go:not(.ghost):hover{background:#FFC4E6}

/* weapon picker */
.weapons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-4px 0 18px}
.weapons[hidden]{display:none}
.wpn{background:var(--bg);color:var(--ink);border:2.5px solid var(--line);border-radius:14px;padding:8px 6px 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--sans);font-size:14px;font-weight:600;transition:transform .1s}
.wpn svg{width:56px;height:56px;overflow:visible;margin:-4px 0 -6px}
.wpn:hover{transform:rotate(-2deg)}
.wpn[aria-checked="true"]{background:var(--pink);color:#000;border-color:var(--cline)}
.danger{display:flex;gap:3px;margin-top:4px}
.scores{width:100%;border-collapse:separate;border-spacing:0;margin:2px 0 14px;border:2.5px solid var(--line);border-radius:14px;overflow:hidden;font-family:var(--sans)}
.scores[hidden]{display:none}
.lives-label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.role{position:relative;background:var(--surface);padding:10px 14px;border-radius:10px;isolation:isolate}
.role::before{content:"";position:absolute;inset:0;border:2.5px solid var(--line);border-radius:10px;filter:url(#wob);pointer-events:none;z-index:-1}
.role-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#roleName{font-size:22px;line-height:1}
#roleLvl{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.ladder{height:9px;border:2px solid var(--line);border-radius:999px;margin:8px 0 6px;overflow:hidden}
.ladder i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s ease}
.role-next{font-size:12.5px;color:var(--muted)}
.role.promo{animation:promo .9s ease}
@keyframes promo{0%,100%{transform:none}30%{transform:scale(1.05) rotate(-1.5deg);background:var(--yellow)}}
.card.safe .timer{background:var(--blue)}
.flash.good{background:var(--teal)}
.speaker[hidden]{display:none}
/* entry box: its own colour, big title, pop-in */
.bubble.narr{color:#000;animation:narrIn .7s cubic-bezier(.34,1.56,.64,1) both}
.bubble.narr::before{background:var(--pink)}
.bubble.narr h2{font-size:clamp(60px,8.5vw,104px);margin-bottom:6px}
.bubble.narr h2 .l{animation:letterDrop .55s cubic-bezier(.34,1.7,.64,1) both;animation-delay:calc(.25s + var(--i,0)*45ms)}
.bubble.narr p,.bubble.narr .points{animation:fadeUp .5s ease both;animation-delay:.75s}
.bubble.narr .points li::before{background:var(--yellow);border-color:#000}
.bubble.narr .go:not(.ghost){background:var(--yellow);border-color:#000}
.bubble.narr .dots i{border-color:#000}
.bubble.narr .dots i.on{background:var(--yellow)}
@keyframes narrIn{0%{opacity:0;transform:scale(.6) rotate(-5deg)}100%{opacity:1;transform:none}}
@keyframes letterDrop{0%{opacity:0;translate:0 -70px;scale:.6}100%{opacity:1;translate:0 0;scale:1}}
@keyframes fadeUp{0%{opacity:0;translate:0 10px}100%{opacity:1;translate:0 0}}
.hl-red{color:var(--red);font-weight:700}
.hl-blue{color:var(--blue);font-weight:700}

/* weapon demos on hover */
.wpn-ic{position:relative;display:block;width:56px;height:56px;margin:-4px 0 -6px}
.wpn-ic svg{width:100%;height:100%;overflow:visible}
.wpn .fx{position:absolute;pointer-events:none;opacity:0;width:20px;height:20px}
.wpn .fx svg{width:100%;height:100%}
.wpn[data-w="hammer"] svg:first-child{transform-origin:34% 94%}
.wpn[data-w="fist"] svg:first-child{transform-origin:33% 94%}
.wpn[data-w="hammer"] .fx,.wpn[data-w="fist"] .fx{left:-12px;top:6px}
.wpn[data-w="knife"] .fx{left:4px;top:28px;width:46px;height:5px;border-radius:3px;background:var(--red);transform:rotate(40deg) scaleX(0);transform-origin:left}
.wpn:hover[data-w="hammer"] svg:first-child{animation:demoSwing .8s ease-in-out infinite}
.wpn:hover[data-w="fist"] svg:first-child{animation:demoPunch .8s ease-in-out infinite}
.wpn:hover[data-w="knife"] svg:first-child{animation:demoSlash .8s ease-in-out infinite}
.wpn:hover[data-w="hammer"] .fx,.wpn:hover[data-w="fist"] .fx{animation:demoStar .8s ease-out infinite}
.wpn:hover[data-w="knife"] .fx{animation:demoCut .8s ease-out infinite}
@keyframes demoSwing{0%,100%{transform:rotate(18deg)}35%{transform:rotate(-22deg)}50%{transform:rotate(-16deg)}}
@keyframes demoPunch{0%,100%{transform:translate(6px,0)}35%{transform:translate(-8px,0) scale(1.08)}50%{transform:translate(-5px,0)}}
@keyframes demoSlash{0%,100%{transform:translate(8px,-8px) rotate(14deg)}40%{transform:translate(-6px,8px) rotate(-12deg)}}
@keyframes demoStar{0%,30%{opacity:0;transform:scale(.3)}42%{opacity:1;transform:scale(1.3) rotate(30deg)}70%,100%{opacity:0;transform:scale(.8) rotate(60deg)}}
@keyframes demoCut{0%,25%{opacity:1;transform:rotate(40deg) scaleX(0)}45%{opacity:1;transform:rotate(40deg) scaleX(1)}80%,100%{opacity:0;transform:rotate(40deg) scaleX(1)}}

/* welcome splash */
@property --hole{syntax:'<percentage>';inherits:false;initial-value:0%}
.splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:var(--teal);overflow:hidden;cursor:pointer}
.splash-wipe{position:fixed;inset:0;z-index:300;pointer-events:none;background:var(--teal);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,transparent var(--hole),#000 calc(var(--hole) + .5%));
          mask-image:radial-gradient(circle at 50% 50%,transparent var(--hole),#000 calc(var(--hole) + .5%))}
.splash-wipe[hidden]{display:none}
.splash-wipe.go{animation:radialOut .85s cubic-bezier(.65,0,.35,1) forwards}
.splash[hidden]{display:none}
.splash .band{inset:12px;--band:var(--yellow)}
.splash .band::after{content:"";position:absolute;inset:21px;background:var(--teal);border:3px solid #000}
.splash .corner{--band:var(--yellow)}
.splash .corner::after{background:var(--teal)}
.splash .corner.tl{left:12px;top:12px}.splash .corner.tr{right:12px;top:12px;left:auto}
.splash .corner.bl{left:12px;bottom:12px;top:auto}.splash .corner.br{right:12px;bottom:12px;left:auto;top:auto}
.splash-in{position:relative;text-align:center;padding:20px 64px;max-width:100%;transition:opacity .25s ease}
.splash-sub{text-wrap:balance}
.splash-stage{position:relative;display:inline-block}
.splash-title{margin:0;font-size:clamp(72px,15vw,220px);line-height:.9;color:var(--yellow);-webkit-text-stroke:3px #000;paint-order:stroke fill;
  text-shadow:6px 6px 0 #000;filter:none;opacity:0;transform-origin:50% 100%}
.splash.hit .splash-title{animation:plop .6s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes plop{0%{opacity:0;transform:translateY(-70px) scale(1.25)}40%{opacity:1;transform:translateY(0) scale(1.12,.72)}70%{transform:scale(.96,1.05)}100%{opacity:1;transform:none}}
.splash-hammer{position:absolute;right:-12%;top:-24%;width:clamp(80px,13vw,170px);aspect-ratio:1;transform-origin:34% 94%;opacity:0;rotate:60deg}
.splash.play .splash-hammer{animation:hammerIn .9s cubic-bezier(.5,0,.3,1) forwards}
@keyframes hammerIn{0%{opacity:0;rotate:70deg;translate:40px -40px}60%{opacity:1;rotate:35deg;translate:0 0}86%{rotate:-62deg}93%{rotate:-50deg}100%{opacity:1;rotate:-56deg}}
.splash-sub{margin:26px 0 0;font-size:clamp(16px,2vw,22px);font-weight:600;color:#fff;opacity:0}
.splash.hit .splash-sub{animation:fadeUp .5s ease forwards;animation-delay:.45s}
.splash-skip{margin:10px 0 0;font-size:13px;color:rgba(255,255,255,.75);opacity:0}
.splash.hit .splash-skip{animation:fadeUp .5s ease forwards;animation-delay:.8s}
@keyframes radialOut{to{--hole:101%}}
.points{list-style:none;margin:4px 0 18px;padding:0;display:grid;gap:7px;font-size:16px;line-height:1.35}
.bubble p:has(+ .points:not([hidden])){flex:none;min-height:0;margin-bottom:12px}
.points[hidden],#dBody[hidden]{display:none}
.points li{position:relative;padding-left:22px}
.points li::before{content:"";position:absolute;left:2px;top:.42em;width:10px;height:10px;border-radius:50%;background:var(--pink);border:2px solid var(--cline)}
.bubble.narr::after{display:none}
.scores th,.scores td{padding:8px 14px;text-align:left;vertical-align:middle}
.scores th{font-size:15px;font-weight:600}
.scores td{text-align:right;font-size:34px;line-height:1;width:1%;white-space:nowrap}
.scores tr+tr th,.scores tr+tr td{border-top:2px dashed var(--dash)}
.scores tr.hi{background:var(--yellow);color:#000}
.badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;vertical-align:2px}
.danger i{width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.danger i.on{background:var(--red);border-color:var(--cline)}
:root[data-theme="dark"] .wpn:not([aria-checked="true"]) .danger i.on{border-color:var(--red)}

/* knife effects */
.splat{position:fixed;z-index:99;pointer-events:none;width:70px;height:70px}
.drop{position:fixed;z-index:99;pointer-events:none;border-radius:50%;background:var(--red)}
.smear{position:absolute;left:14%;right:14%;top:20%;bottom:22%;z-index:5;pointer-events:none;animation:smearFade 2.2s ease forwards}
.smear svg{width:100%;height:100%;overflow:visible}
.smear .slash{stroke-dasharray:1;stroke-dashoffset:1;animation:slash .16s ease-out forwards}
@keyframes slash{to{stroke-dashoffset:0}}
@keyframes smearFade{0%,55%{opacity:1}100%{opacity:0}}
/* ---------- phone breakpoint ---------- */
@media (max-width:760px){
  .grid,.lines{grid-template-columns:repeat(3,1fr)!important;grid-template-rows:repeat(6,1fr)!important}
  .cell:nth-child(n+19),.lines i:nth-child(n+19){display:none}

  .cell{padding:2px 4px 4px}

  .name{font-size:16px}
  .card{font-size:16px;line-height:1.05;padding:4px 6px 6px;top:4px;left:4px;right:4px}
  .bonk{font-size:20px}

  .side{display:grid;grid-template-columns:1fr auto;grid-template-areas:"stats ctl" "role role" "todo todo";gap:8px}

  .lives-label{font-size:16px;margin-bottom:2px;white-space:nowrap}
  .cups svg{width:24px}
  .score{font-size:20px}.score b{font-size:20px}
  .btn{font-size:16px;padding:8px 14px}
  #roleName{font-size:20px}
  #roleLvl{font-size:16px}
  .todo-head{font-size:20px;margin-bottom:4px}
  .todo ol{max-height:66px}
  .todo li{font-size:16px;height:22px}
  .flash{font-size:20px;padding:10px 16px 12px;white-space:normal;text-align:center;width:max-content;max-width:88%}

  .overlay{padding:12px}
  .bubble{padding:16px 16px 14px}
  .bubble h2{font-size:clamp(24px,7.4vw,30px);line-height:1;margin-bottom:10px}
  .bubble.narr h2{font-size:clamp(44px,14vw,60px)}
  .bubble p,.points{font-size:16px}
  .overlay{overflow-y:auto;align-items:center}
  .dialog{gap:16px}
  .speaker{order:2;align-self:center;width:auto;display:flex;flex-direction:column;align-items:center;gap:2px;margin:0}
  #speakerArt{width:clamp(110px,34vw,150px);flex:none}
  .who{font-size:18px;text-align:center;margin:0;white-space:nowrap}
  .bubble::after{left:calc(50% - 11px);bottom:-13px;top:auto;transform:rotate(-45deg)}
  .ask input{font-size:16px}
  .wpn{font-size:16px}
  .scores th{font-size:16px}
  .scores td{font-size:20px}
  .badge{font-size:16px;padding:1px 8px}
  .dlg-foot{flex-direction:column;align-items:stretch;gap:12px}
  .dots{justify-content:center}

  .splash-title{font-size:clamp(48px,15vw,72px);-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000}

  .splash-title{font-size:clamp(40px,12vw,64px)!important}
  .splash-hammer{right:-15%;top:-40%;width:clamp(56px,15vw,96px)}

  /* fixed-height bottom panel so the character grid never shrinks */

  .cups svg{width:21px}
  .score{font-size:17px}.score b{font-size:18px}

}
</style>

<body>
<svg class="defs" aria-hidden="true">
  <filter id="wob" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wobt" x="-10%" y="-20%" width="120%" height="140%">
    <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="fig" x="-25%" y="-25%" width="160%" height="160%">
    <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="w"/>
    <feMorphology in="w" operator="dilate" radius="1.1" result="d"/>
    <feFlood class="haloc" result="hc"/><feComposite in="hc" in2="d" operator="in" result="halo"/>
    <feFlood class="shadowc" result="sc"/><feComposite in="sc" in2="d" operator="in" result="s"/>
    <feOffset in="s" dx="1.8" dy="1.8" result="so"/>
    <feMerge><feMergeNode in="so"/><feMergeNode in="halo"/><feMergeNode in="w"/></feMerge>
  </filter>
  <filter id="figP" x="-25%" y="-25%" width="160%" height="160%">
    <feTurbulence class="turb" type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="w"/>
    <feMorphology in="w" operator="dilate" radius="1.1" result="d"/>
    <feFlood class="haloc" result="hc"/><feComposite in="hc" in2="d" operator="in" result="halo"/>
    <feMerge><feMergeNode in="halo"/><feMergeNode in="w"/></feMerge>

</svg>

<div class="shell">

      <path d="M18 48 H26 M18 53 H26" fill="none"/>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = matchMedia('(pointer: fine)').matches;
const R = (a,b)=>a+Math.random()*(b-a);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const $ = id=>document.getElementById(id);

/* line boil */
if(!reduce){ const ts=[...document.querySelectorAll('.turb')]; let s=0; setInterval(()=>{ if(window.noBoil||matchMedia('(max-width:760px)').matches) return; s=(s+1)%4;ts.forEach(t=>t.setAttribute('seed',[3,11,27,42][s]))},160); }

/* the wiggly display face: every letter gets its own tilt and baseline */
function wig(text){
  const esc = c=>c==='<'?'&lt;':c==='&'?'&amp;':c;
  return String(text).split(' ').map(w=>`<span class="w">${[...w].map(c=>`<span class="l" style="--r:${R(-7,7).toFixed(1)}deg;--y:${R(-.07,.07).toFixed(2)}em">${esc(c)}</span>`).join('')}</span>`).join(' ');
}
const wigInto = (el,text)=>{ el.innerHTML = wig(text); el.setAttribute('aria-label',text); };
document.querySelectorAll('[data-wig]').forEach(el=>{
  [...el.childNodes].forEach(n=>{ if(n.nodeType===3 && n.textContent.trim()){ const s=document.createElement('span'); s.innerHTML=wig(n.textContent.trim())+' '; n.replaceWith(s); } });
});

/* ---------------- theme ---------------- */
const root=document.documentElement, themeBtn=$('themeBtn');
const SUN=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>`;
const MOON=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 10A6 6 0 0 1 6 3a6 6 0 1 0 7 7Z"/></svg>`;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function paintThemeBtn(){ const d=isDark(), l=`Switch to ${d?'light':'dark'} mode`; themeBtn.innerHTML=d?SUN:MOON; themeBtn.setAttribute('aria-label',l); themeBtn.title=l; }
try{ root.dataset.theme=localStorage.getItem('wtf-theme')||'light'; }catch(e){ root.dataset.theme='light'; }
themeBtn.addEventListener('click',()=>{ root.dataset.theme=isDark()?'light':'dark'; try{localStorage.setItem('wtf-theme',root.dataset.theme)}catch(e){} paintThemeBtn(); });
paintThemeBtn();

/* ---------------- characters ---------------- */
const F = c=>`style="fill:var(--${c})"`;
const BODIES = {
  tall:{l:50,r:70,svg:`<path d="M50 78 H70 V118 H50 Z"/><path class="n" d="M55 118 V141 M65 118 V141 M50 141 H56 M64 141 H70"/>`},
  blob:{l:46,r:74,svg:`<path d="M44 122 C42 94 48 76 60 76 C72 76 78 94 76 122 Z"/><path class="n" d="M53 122 V141 M67 122 V141 M48 141 H54 M66 141 H72"/>`},
  dress:{l:53,r:67,svg:`<path d="M53 78 H67 L76 122 H44 Z"/><path class="n" d="M55 122 V141 M65 122 V141 M50 141 H56 M64 141 H70"/>`}
};
const armL = x=>`<path class="n" d="M${x} 90 C${x-12} 90 ${x-14} 104 ${x-2} 104"/>`;
const armR = x=>`<path class="n" d="M${x} 90 C${x+12} 90 ${x+14} 104 ${x+2} 104"/>`;
const C = `<circle cx="60" cy="52" r="17"/>`;
const mane = (()=>{ let d=''; const n=14; for(let i=0;i<=n;i++){ const a=i/n*Math.PI*2, r=i%2?22:27; d+=(i?'L':'M')+(60+Math.cos(a)*r).toFixed(1)+' '+(53+Math.sin(a)*r).toFixed(1)+' '; } return `<path d="${d}Z" ${F('orange')}/>`; })();

function face(h){
  let s=h.eyes.map(([x,y])=>`<path class="n sleep" d="M${x-3} ${y} q3 2.5 6 0"/><circle class="k wake" cx="${x}" cy="${y}" r="2"/>`).join('');
  if(h.mouth){ const [x,y]=h.mouth; s+=`<path class="n sleep mo" d="M${x-3} ${y} q3 2 6 0"/><ellipse class="wake mo" style="fill:var(--mouth)" cx="${x}" cy="${y+1}" rx="2.8" ry="3.4"/>`; }
  return s;
}
function charSVG([hk,bk,ak,,hc,bc]){
  const h=HEADS[hk], b=BODIES[bk], a=ACC[ak](b,h);
  return `<svg class="ch" viewBox="14 4 92 142" preserveAspectRatio="xMidYMax meet" aria-hidden="true" style="--hc:var(--${hc});--bc:var(--${bc})">
    <path class="ground" d="M10 142 C40 141 80 143.5 110 142"/>
    <g class="fig" filter="url(#fig)"><g class="press"><g class="pose">
      ${a.behind??''}<g class="body">${b.svg}</g>${a.L??armL(b.l)}${a.R??armR(b.r)}${a.body??''}<path class="n" d="M60 69 V77"/>
      <g transform="translate(60 56) scale(1.2) translate(-60 -56)"><g class="head">${h.back}${h.front}</g>${face(h)}${a.head??''}</g>
    </g></g></g></svg>`;
}
const oddCase=s=>[...s].map((c,i)=>((i*7+s.length)%3===0?c.toUpperCase():c.toLowerCase())).join('');

  el.innerHTML=charSVG(c)+`<div class="name disp">${wig(oddCase(c[3]))}</div>`;
  el.querySelector('.pose').style.setProperty('--d',(-Math.random()*3).toFixed(2)+'s');
  grid.appendChild(el);
  const cell={el,active:false,card:null,bar:null,phrase:'',exp:0,stay:0};
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); whack(cell,e); });
  return cell;
});

/* original background loop: a bouncy, slightly silly chiptune */
function startMusic(){
  const bpm=132, e8=60/bpm/2, bar=e8*8, mf=m=>440*Math.pow(2,(m-69)/12);
  const bass=[36,40,33,41,36,38,31,31];
  const tune=[[72,null,76,79,null,78,79,null],[80,null,76,null,74,72,71,null],[69,72,76,null,72,null,69,null],[77,76,74,72,74,null,null,null],
              [72,null,76,79,null,84,83,null],[81,null,78,null,74,null,72,null],[79,null,77,74,71,null,74,null],[79,78,79,null,67,null,null,null]];
  let next=ac.currentTime+.15, b=0, hatBuf=null;
  const blip=(type,f,t,len,vol,cut)=>{ const o=ac.createOscillator(), g=ac.createGain(), lp=ac.createBiquadFilter();
    o.type=type; o.frequency.value=f; lp.type='lowpass'; lp.frequency.value=cut;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(lp); lp.connect(g); g.connect(musicBus); o.start(t); o.stop(t+len+.02); };
  const hat=(t,vol)=>{ if(!hatBuf){ hatBuf=ac.createBuffer(1,ac.sampleRate*.05,ac.sampleRate); const d=hatBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const n=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain(); n.buffer=hatBuf; f.type='highpass'; f.frequency.value=7000;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+.035); n.connect(f); f.connect(g); g.connect(musicBus); n.start(t); n.stop(t+.05); };
  const kick=t=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(48,t+.09);
    g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.0001,t+.11); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+.13); };
  function schedule(){
    while(next<ac.currentTime+1.2){
      const i=b%8, root=bass[i];
      for(let k=0;k<8;k++){
        const t=next+k*e8;
        if(k%2===0) blip('triangle',mf(root+(k%4===2?7:0)),t,.14,.32,1200);   // oom-pah bass
        if(k===0||k===4) kick(t);
        if(k%2===1) hat(t,.05);

}

    return t?`<li class="filled${t.fresh?' new':''}${i>=7?' danger':''}"><span class="box"></span><span class="disp">${t.html}</span></li>`:`<li><span class="box"></span></li>`; }).join('');
  S.todos.forEach(t=>t.fresh=false);
  const L=LEVELS[S.lvl], N=LEVELS[S.lvl+1];
  $('roleName').innerHTML=wig(L.role); $('roleLvl').textContent=`Level ${S.lvl+1} of ${LEVELS.length}`;
  $('roleBar').style.width = N ? `${Math.min(100,(S.score-L.at)/(N.at-L.at)*100)}%` : '100%';
  $('roleNext').textContent = N ? `${N.at-S.score} more to ${N.role}` : 'You run the place now';
}
function paintPause(){ pauseBtn.innerHTML=PAUSE_ICON+'Pause'; pauseBtn.disabled=!S.running||S.paused; }
const later=(ms,fn)=>S.jobs.push({at:S.t+ms,fn});
/* pace: steady until Senior Designer, then the stakeholder back-and-forth kicks in */
const level=()=>{
  const sr=S.lvl>=2, boost=sr?1.25+(S.lvl-2)*.2:1;
  return {stay:Math.max(sr?700:900,(2400-S.score*6)/boost), gap:Math.max(sr?260:420,(1150-S.score*3)/boost),
          max:S.lvl>=3?4:sr?3:S.score<15?1:2};
};

function activate(c,stay){
  c.safe = S.score>=4 && Math.random() < (S.lvl>=2 ? .2+(S.lvl-2)*.06 : .12+S.lvl*.02);
  c.active=true; c.phrase=pick(c.safe?APPROVALS:PHRASES); c.stay=stay; c.exp=S.t+stay;
  c.el.classList.remove('hit'); c.el.classList.add('on');
  const card=document.createElement('div'); card.className='card'+(c.safe?' safe':'');
  card.innerHTML=`<span class="disp">${wig(c.phrase)}</span><span class="timer"></span>`;
  card.setAttribute('aria-label',c.phrase);
  c.el.appendChild(card); c.card=card; c.bar=card.querySelector('.timer');
}
function sleep(c,cls){
  c.active=false; c.el.classList.remove('on');
  const card=c.card; c.card=null;
  if(card){ card.classList.add(cls); setTimeout(()=>card.remove(),450); }
}
function whack(c,e){
  if(!S.running||S.paused||!c.active) return;
  if(c.safe){
    sleep(c,'gone'); c.el.classList.remove('hit'); void c.el.offsetWidth; c.el.classList.add('hit');
    hitFx(c,e.clientX,e.clientY); burnout('yOu whackEd an apprOval!'); return;
  }
  sleep(c,'gone');
  c.el.classList.remove('hit'); void c.el.offsetWidth; c.el.classList.add('hit','pressed');
  setTimeout(()=>c.el.classList.remove('pressed'),160);
  hitFx(c,e.clientX,e.clientY);
  const b=document.createElement('div'); b.className='bonk disp'; b.innerHTML=wig(pick(weapon==='knife'?['cut!','sliced','scrapped','chopped','trimmed']:weapon==='fist'?['pow!','biff','done!','sorted','nope']:['done!','sorted','shipped','bonk','nope','fixed','approved']));
  c.el.appendChild(b); setTimeout(()=>b.remove(),650);
  S.score++; S.streak++;
  const N=LEVELS[S.lvl+1];
  if(N && S.score>=N.at){ S.lvl++; promote(); return; }
  if(S.streak>=5){
    S.streak=0;
    if(S.todos.length){ listEl.children[S.todos.length-1]?.classList.add('done'); S.todos.pop(); scoreEl.innerHTML=wig(S.score); setTimeout(render,350); return; }
  }
  render();
}
function miss(c){
  if(c.safe){ sleep(c,'gone'); return; }
  sleep(c,'missed'); S.streak=0; SFX.miss();
  const text=c.phrase.replace(/[!?.…]+$/,'').toLowerCase();
  S.todos.push({html:wig(text),fresh:true});
  render();
  if(S.todos.length>=MAX_TODO) burnout();
}
function flash(t,cls){ const f=document.createElement('div'); f.className='flash disp'+(cls?' '+cls:''); f.innerHTML=wig(t); $('app').appendChild(f); setTimeout(()=>f.remove(),1300); }
function burnout(msg){
  S.lives--; S.streak=0; cells.forEach(c=>c.active&&sleep(c,'gone')); S.lives>0?SFX.burnout():SFX.over();
  if(S.lives<=0){ render(); gameOver(); return; }
  flash(msg || (S.lives===1?'last cOffEE. carEful.':'buRnOut. OnE cOffEE dOwn.'));
  render(); S.cooldown=S.t+1600;
  later(1300,()=>{ S.todos=[]; S.streak=0; render(); });
}
let autoDark=false;
function promote(){
  cells.forEach(c=>c.active&&sleep(c,'gone'));
  if(S.lvl===LEVELS.length-1){ render(); win(); return; }
  S.todos=[]; S.streak=0; render(); SFX.promo();
  if(S.lvl===2 && root.dataset.theme!=='dark'){ root.dataset.theme='dark'; autoDark=true; paintThemeBtn(); }
  const r=$('role'); r.classList.remove('promo'); void r.offsetWidth; r.classList.add('promo');
  flash(`prOmOtEd: ${LEVELS[S.lvl].role}!`,'good');
  S.cooldown=S.t+1600;
}
function scoreRows(){
  const prevBest=best, newBest=S.score>prevBest;
  if(newBest){ best=S.score; try{localStorage.setItem('wtf-best',best)}catch(e){} }
  const today={label:'Today’s score', value:S.score, hi:newBest, badge:newBest?'New best!':''};
  const top={label:'Best so far', value:prevBest};
  return {rows:newBest?[today,top]:[top,today], newBest};
}
function win(){
  S.running=false; paintPause(); SFX.win();
  const r=$('app').getBoundingClientRect();
  for(let k=0;k<6;k++) setTimeout(()=>sparkle(R(r.left+r.width*.2,r.right-r.width*.2),R(r.top+r.height*.2,r.bottom-r.height*.4)),k*180);
  const {rows}=scoreRows();
  say({t:'yOu’RE thE cO-fOundER!', rows,
       b:`You made it to the top, ${nm()}. From now on the feedback is someone else’s problem. Enjoy the corner office. It’s a beanbag.`,
       btns:[['Hear the intro again',()=>intro(0),true],['Start a new day',()=>intro(INTRO.length-1)]]});
}
function gameOver(){
  S.running=false; render(); paintPause();
  const {rows,newBest}=scoreRows(), role=LEVELS[S.lvl].role;
  say({t:'Out Of cOffEE.', rows,
       b:`That’s a wrap, ${nm()}${newBest?', and a new personal best':''}. You made it to ${role}. The clients will be back tomorrow. They always are.`,
       btns:[['Hear the intro again',()=>intro(0),true],['Start a new day',()=>intro(INTRO.length-1)]]});
}
function pause(){
  if(!S.running||S.paused) return;
  S.paused=true; document.body.classList.add('paused'); if(ac) musicBus.gain.setTargetAtTime(.03,ac.currentTime,.3); paintPause();
  say({t:'On a snack bREak', b:`Clock’s stopped, ${nm()}. You’ve handled ${S.score} so far and there are ${S.todos.length} thing${S.todos.length===1?'':'s'} on your list. The clients will wait. Probably.`,
       btns:[['Restart the day',()=>{ reset(); intro(player?WELCOME_STEP:NAME_STEP); },true],['Back to work',resume]]});
}
function resume(){ if(ac) musicBus.gain.setTargetAtTime(.08,ac.currentTime,.3); S.paused=false; document.body.classList.remove('paused'); dlg.hidden=true; paintPause(); }
function start(){ finishTyping(); if(autoDark){ root.dataset.theme='light'; autoDark=false; paintThemeBtn(); } reset(); S.running=true; dlg.hidden=true; paintPause(); }

function tick(now){
  const dt=Math.min(now-last,50); last=now;
  if(S.running&&!S.paused){
    S.t+=dt;
    S.jobs=S.jobs.filter(j=>{ if(j.at<=S.t){ j.fn(); return false; } return true; });
    for(const c of cells){
      if(!c.active) continue;
      const left=(c.exp-S.t)/c.stay;
      if(c.bar) c.bar.style.transform=`scaleX(${Math.max(0,left)})`;
      if(left<=0){ miss(c); if(!S.running) break; }
    }
    if(S.running&&S.t>=S.nextSpawn&&S.t>=S.cooldown){
      const L=level(), busy=cells.filter(c=>c.active).length;
      if(busy<L.max){ const idle=pool().filter(c=>!c.active); activate(pick(idle),L.stay); }
      S.nextSpawn=S.t+L.gap+Math.random()*350;
    }
  }
  requestAnimationFrame(tick);
}

/* phones play with 18 clients (3 x 6) so each one is big enough to tap */
const phoneMQ=matchMedia('(max-width:760px)');
const pool=()=>phoneMQ.matches?cells.slice(0,18):cells;
phoneMQ.addEventListener?.('change',()=>{ if(phoneMQ.matches) cells.slice(18).forEach(c=>c.active&&sleep(c,'gone')); });

pauseBtn.addEventListener('click',pause);
document.addEventListener('keydown',e=>{
  if(!S.running) return;
  if(e.key===' '||e.key==='p'||e.key==='P'||e.key==='Escape'){ e.preventDefault(); S.paused?resume():pause(); }
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });

/* fresh start for a new player: forget name, best score and theme */
$('refreshBtn').addEventListener('click',()=>{
  try{ ['wtf-name','wtf-best','wtf-theme','wtf-weapon','wtf-sound'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
  player=''; best=0; root.dataset.theme='light'; paintThemeBtn(); setWeapon('hammer'); setSound(true);
  finishTyping(); reset(); runSplash();
});

/* welcome animation on every fresh load / refresh */
let splashDone=null;
function runSplash(){
  const sp=$('splash'), t=$('splashTitle'), h=$('splashHammer');
  window.noBoil=true; dlg.hidden=true; sp.hidden=false; sp.classList.remove('play','out','hit');
  t.innerHTML=wig('whackathOn'); t.querySelectorAll('.l').forEach((l,i)=>l.style.setProperty('--i',i));
  h.innerHTML=`<svg viewBox="0 0 64 64" overflow="visible">${WEAPONS.hammer.svg}</svg>`;
  void sp.offsetWidth; sp.classList.add('play');
  let finished=false;
  const finish=()=>{ if(finished) return; finished=true; clearTimeout(t1); clearTimeout(t2);
    const w=$('splashWipe'); w.classList.remove('go'); w.hidden=false; void w.offsetWidth; sp.hidden=true; w.classList.add('go');
    setTimeout(()=>intro(0), reduce?0:300); setTimeout(()=>{ w.hidden=true; w.classList.remove('go'); window.noBoil=false; }, reduce?50:950); };
  const t1=setTimeout(()=>{ sp.classList.add('hit'); const r=h.getBoundingClientRect(); sparkle(r.left+r.width*.12,r.top+r.height*.28); sparkle(r.left+r.width*.12,r.top+r.height*.28); }, reduce?0:780);
  const t2=setTimeout(finish, reduce?600:3800);
  sp.onclick=finish; splashDone=finish;
}
document.addEventListener('keydown',e=>{ if(!$('splash').hidden && splashDone){ splashDone(); } });

reset(); runSplash();
requestAnimationFrame(t=>{last=t;tick(t);});
</script>
</body>
